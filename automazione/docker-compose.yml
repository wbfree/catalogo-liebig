# Da lanciare dalla cartella automazione/:
#   docker compose run --rm aggiornamento
#
# Se lo usi da Container Manager, il progetto deve puntare a QUESTA cartella:
# il contesto di build e' relativo alla posizione di questo file.
services:
  aggiornamento:
    build:
      context: .
      dockerfile: Dockerfile
    image: catalogo-liebig:2
    # l'immagine non sta in nessun registro: va costruita, non scaricata
    pull_policy: build
    working_dir: /app
    volumes:
      # tutto il repository, cosi' il contenitore legge .env e le sorgenti
      # e riscrive ebay_active.json e storico/ direttamente sul NAS
      - ..:/app
    # il lavoro e' tutto rete e JSON: 512 MB bastano con abbondanza
    mem_limit: 512m
    restart: "no"
