# Da lanciare dalla cartella automazione/:
#   docker compose run --rm aggiornamento
#
# Se lo usi da Container Manager, il progetto deve puntare a QUESTA cartella:
# il contesto di build e' relativo alla posizione di questo file, e qui accanto
# deve esserci il Dockerfile.
services:
  aggiornamento:
    build:
      context: .
      dockerfile: Dockerfile
    image: catalogo-liebig:1
    # l'immagine non sta in nessun registro: va costruita, non scaricata
    pull_policy: build
    working_dir: /app
    volumes:
      # tutto il repository, cosi' il contenitore legge .env e le sorgenti
      # e riscrive ebay_active.json e storico/ direttamente sul NAS
      - ..:/app
    # /dev/shm predefinito e' 64 MB: Chromium ci muore sopra
    shm_size: '1gb'
    # il DS218+ ha 2 GB in tutto e DSM ne vuole una parte
    mem_limit: 1400m
    restart: "no"
